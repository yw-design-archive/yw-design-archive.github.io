<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>内容编辑 · 王蕴作品集</title><link rel="stylesheet" href="style.css"><style>main{max-width:920px;margin:auto;padding:45px 24px}h1{font-size:32px;letter-spacing:0}label{display:block;font-size:13px;margin:18px 0}input,textarea{display:block;width:100%;padding:12px;border:1px solid #c9cdc1;border-radius:4px;margin-top:8px;background:#fff;color:#21251f}textarea{min-height:100px;resize:vertical}details{border-top:1px solid #ccc;padding:18px 0}summary{cursor:pointer;font-size:19px}button,.action{border:1px solid #153dc9;background:#153dc9;color:#fff;border-radius:5px;padding:11px 16px;font-size:12px;display:inline-block}.actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--paper);padding:18px 0;z-index:2}.note{font-size:13px;line-height:1.9;color:#666}#status{font-size:13px;color:#153dc9}#import{display:none}</style></head><body><main><a href="index.html">← 返回网站</a><h1>你的作品，持续更新。</h1><p class="note">这里编辑的是本机草稿，不会直接改变已发布的网站。保存后可预览；下载 content.json 并发回当前聊天，我会将修改发布到同一网址。封面可填写图片网址，或从本机上传。完整图版、布局及履历调整也可以直接在聊天中提出。</p><div class="actions"><button id="save">保存本机草稿</button><a class="action" href="index.html?preview=1" target="_blank">预览草稿 ↗</a><button id="export">下载修改内容</button><button id="load">导入内容文件</button><button id="reset">恢复已发布内容</button><input id="import" type="file" accept="application/json,.json"></div><p id="status" role="status"></p><div id="fields"></div><h2 style="font-size:26px;margin:40px 0 22px">作品项目</h2><div id="projects"></div></main><script src="editor.js"></script></body></html>
